# Zadig 2.9 settings for Capsula Mini.
# The file is read from the current directory.

[general]
advanced_mode = true
exit_on_success = true
log_level = 1

[device]
list_all = true
include_hubs = false
trim_whitespaces = true

[driver]
default_driver = 0
extract_only = false

